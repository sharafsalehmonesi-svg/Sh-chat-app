
name: Build SH-CHAT Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check project ZIP
        run: |
          ls -la
          test -f SH-CHAT-Android-Project.zip

      - name: Extract Android project
        run: |
          unzip -o SH-CHAT-Android-Project.zip -d extracted
          test -f extracted/shchat-android/app/build.gradle

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip

      - name: Build APK
        run: |
          gradle-8.9/bin/gradle -p extracted/shchat-android assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SH-CHAT-Android-APK
          path: extracted/shchat-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

